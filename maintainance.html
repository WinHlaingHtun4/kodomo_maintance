<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ただいまメンテナンス中です</title>
    <style>
        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.6;
            background-color: #fff;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .maintenance-container {
            max-width: 600px;
            width: 90%;
            padding: 40px 30px;
            background-color: #f2f2f2;
            border-radius: 20px;
            border: 3px solid #f3b925;
            text-align: center;
            box-sizing: border-box;
        }
        .maintenance-icon {
            font-size: 40px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #000;
        }
        p {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="maintenance-icon">🛠️</div>
        <h1>ただいまメンテナンス中です</h1>
        <p>
            ただいまメンテナンス中です。<br>
            ご不便をおかけいたしますが、しばらく時間をおいてから再度アクセスしてください。
        </p>
    </div>
</body>
</html>
